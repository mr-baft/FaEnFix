# با هر تگ v* (مثلاً v1.1.0) نصب‌کننده‌ی FaEnFix-Setup.exe و نسخه‌ی قابل‌حمل FaEnFix.exe ساخته و در Releases منتشر می‌شوند
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read          # برای SignPath (خواندن جزئیات job و دانلود artifact)

# امضای دیجیتال (SignPath Foundation): تا وقتی متغیر SIGNPATH_ORGANIZATION_ID در
# Settings → Secrets and variables → Actions → Variables تعریف نشده، این مرحله‌ها اجرا نمی‌شوند.
# لازم: secret به اسم SIGNPATH_API_TOKEN، و variableهای SIGNPATH_ORGANIZATION_ID،
# SIGNPATH_PROJECT_SLUG (مثلاً FaEnFix) و SIGNPATH_POLICY_SLUG (مثلاً release-signing)
env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          # از GitHub (سایت autohotkey.com پشت Cloudflare است و دانلود خودکار را رد می‌کند)
          $h = @{ Authorization = "Bearer ${{ github.token }}" }
          $rel = Invoke-RestMethod https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest -Headers $h
          $zip = $rel.assets | Where-Object name -like '*.zip' | Select-Object -First 1
          Invoke-WebRequest $zip.browser_download_url -OutFile build/ahk.zip
          Expand-Archive build/ahk.zip build/ahk
          $rel = Invoke-RestMethod https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest -Headers $h
          $zip = $rel.assets | Where-Object name -like '*.zip' | Select-Object -First 1
          Invoke-WebRequest $zip.browser_download_url -OutFile build/ahk2exe.zip
          Expand-Archive build/ahk2exe.zip build/ahk2exe
          Get-ChildItem build -Recurse -Filter *.exe | Select-Object -ExpandProperty FullName

      - name: Unit tests
        shell: pwsh
        run: |
          # یک بار با کیبورد فارسی پیش‌فرض سرور («فارسی» قدیمی) و یک بار با «فارسی استاندارد»
          foreach ($layout in @('', '00050429')) {
            $a = @('/ErrorStdOut', 'tests/unit.ahk'); if ($layout) { $a += $layout }
            $p = Start-Process build/ahk/AutoHotkey64.exe -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput unit.txt
            Get-Content unit.txt -Encoding UTF8
            if ($p.ExitCode -ne 0) { throw "unit tests failed ($($p.ExitCode))" }
          }

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $s = Get-Content FaEnFix.ahk -Raw -Encoding UTF8
          $s = $s -replace ';@Ahk2Exe-SetVersion .*', ";@Ahk2Exe-SetVersion $ver"
          [IO.File]::WriteAllText("$PWD/FaEnFix.ahk", $s, [Text.UTF8Encoding]::new($true))

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $p = Start-Process build/ahk2exe/Ahk2Exe.exe -Wait -PassThru -ArgumentList `
            '/in', 'FaEnFix.ahk', '/out', 'dist/FaEnFix.exe', '/base', "$PWD/build/ahk/AutoHotkey64.exe", '/silent'
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist/FaEnFix.exe)) { throw "Ahk2Exe failed ($($p.ExitCode))" }
          Get-Item dist/FaEnFix.exe

      - name: Upload unsigned exe for signing
        id: unsigned-exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FaEnFix-exe-unsigned
          path: dist/FaEnFix.exe

      - name: Sign exe (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600     # هر امضا دستی تأیید می‌شود
          output-artifact-directory: signed-exe

      - name: Use signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-exe/FaEnFix.exe dist/FaEnFix.exe -Force
          Get-AuthenticodeSignature dist/FaEnFix.exe | Format-List Status, SignerCertificate

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          & $iscc "/DAppVersion=$ver" installer/FaEnFix.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist/FaEnFix-Setup.exe

      - name: Upload unsigned installer for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FaEnFix-setup-unsigned
          path: dist/FaEnFix-Setup.exe

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-setup/FaEnFix-Setup.exe dist/FaEnFix-Setup.exe -Force
          Get-AuthenticodeSignature dist/FaEnFix-Setup.exe | Format-List Status, SignerCertificate

      - uses: actions/upload-artifact@v4
        with:
          name: FaEnFix
          path: |
            dist/FaEnFix-Setup.exe
            dist/FaEnFix.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FaEnFix-Setup.exe
            dist/FaEnFix.exe
          generate_release_notes: true
          body: |
            **[⬇️ FaEnFix-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/FaEnFix-Setup.exe)** · [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) · [Privacy policy](https://github.com/${{ github.repository }}#privacy-policy)
